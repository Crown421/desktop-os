---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: desktop-os
# description will be included in the image's metadata
description: OS image for desktop.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway
image-version: 44

modules:
  - from-file: desktop/apps-flatpak.yml
  - type: chezmoi
    repository: "https://github.com/Crown421/atomic-dots"
  - type: justfiles
    validate: true
  - from-file: desktop/apps-dnf.yml
  - from-file: desktop/wayland-tweaks.yml
  ## on device this is not working, but default sddm is.
  # - from-file: desktop/greeter.yml
  - type: signing
