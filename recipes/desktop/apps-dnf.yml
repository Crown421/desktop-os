modules:
  - type: dnf
    no-cache: true
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://cli.github.com/packages/rpm/gh-cli.repo
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
      copr:
        enable:
          - jdxcode/mise
    install:
      packages:
        - tailscale
        - kitty
        - zsh
        - gh
        - chromium
        - code
        - powertop
        - https://github.com/Crown421/guayusa-wl/releases/download/0.2.2/guayusa-wl-0.2.2-1.x86_64.rpm
        - https://github.com/Crown421/hars-imp/releases/download/v0.4.0/hars-imp-0.4.0-1.x86_64.rpm
        - hunspell-de
        - podman-compose
        - mise
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - hunspell-en
